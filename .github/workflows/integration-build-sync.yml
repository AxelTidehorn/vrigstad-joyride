name: Temporary V4 physics build sync
on:
  push:
    branches: [contrib/oliver-r187-v4-powertrains]
    paths: ['src/**', 'tests/**', 'tools/**', 'package*.json', '.github/workflows/integration-build-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run data && npm run check && npm run test:driving && npm run build
      - name: Commit generated build on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html map.html data/vrigstad.json
          if ! git diff --cached --quiet; then
            git commit -m "build(driving): sync generated r187 pages"
            git push
          fi
