name: Visual integration review
on:
  pull_request:
    paths:
      - 'src/game.html'
      - 'src/visual/film-pipeline.js'
      - 'index.html'
      - 'tools/visual-review.py'
      - '.github/workflows/visual-integration-review.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - run: python after/tools/visual-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-integration-review
          path: visual-review/
          if-no-files-found: warn
