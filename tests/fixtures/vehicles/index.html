<!doctype html><base href="/"><canvas id="gl"></canvas><script type="module">
import * as THREE from 'three';
import '../../../src/world/three-legacy';
import {createVehicleVisuals} from '../../../src/game/render/vehicle-visuals';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas')});renderer.setSize(400,300);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,4/3,.1,200);camera.position.set(0,8,14);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x444444,3));
const assets=createVehicleVisuals(false);
const cars=[-3,3].map(x=>{const mesh=new THREE.Group();mesh.position.x=x;const fallback=new THREE.Mesh(new THREE.BoxGeometry(),new THREE.MeshBasicMaterial());mesh.add(fallback);scene.add(mesh);const c={mesh,x,z:0,h:0};assets.attach(c,'volvo240',fallback);return c;});
window.harness={assets,cars,scene,renderer,THREE};
function frame(){assets.update({x:0,z:0},1/60);renderer.render(scene,camera);requestAnimationFrame(frame);}frame();
</script>
